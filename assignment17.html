
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
</head>
<body>

    <header>
        <h1>Job Application Form</h1>
        <p>Please fill in your details to apply for the job.</p>
    </header>

    <main>
        <form action="#" method="post">

            <fieldset>
                <legend>Personal Information</legend>

                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname" required>
                <br><br>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <br><br>

                <label for="password">Create Password:</label>
                <input type="password" id="password" name="password">
                <br><br>

                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone">
                <br><br>

                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" name="dob">
                <br><br>

                <label for="time">Preferred Interview Time:</label>
                <input type="time" id="time" name="time">
                <br><br>

                <label for="website">Portfolio Website:</label>
                <input type="url" id="website" name="website">
                <br><br>

                <label for="photo">Upload Photograph:</label>
                <input type="file" id="photo" name="photo">
                <br><br>
            </fieldset>

            <br>

            <fieldset>
                <legend>Job Details</legend>

                <p>Gender:</p>
                <input type="radio" id="male" name="gender" value="Male">
                <label for="male">Male</label>

                <input type="radio" id="female" name="gender" value="Female">
                <label for="female">Female</label>

                <input type="radio" id="other" name="gender" value="Other">
                <label for="other">Other</label>
                <br><br>

                <label for="position">Select Position:</label>
                <select id="position" name="position">
                    <option value="">Choose a position</option>
                    <option value="web-developer">Web Developer</option>
                    <option value="software-developer">Software Developer</option>
                    <option value="data-analyst">Data Analyst</option>
                    <option value="intern">Intern</option>
                </select>
                <br><br>

                <label for="experience">Years of Experience:</label>
                <input type="number" id="experience" name="experience" min="0" max="50">
                <br><br>

                <label for="salary">Expected Salary:</label>
                <input type="range" id="salary" name="salary" min="10000" max="100000" step="5000">
                <br><br>

                <label for="color">Choose a Preferred Theme Color:</label>
                <input type="color" id="color" name="color">
                <br><br>

                <label for="resume">Upload Resume:</label>
                <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx">
                <br><br>

                <label for="skills">Skills:</label>
                <input type="checkbox" id="html" name="skills" value="HTML">
                <label for="html">HTML</label>

                <input type="checkbox" id="css" name="skills" value="CSS">
                <label for="css">CSS</label>

                <input type="checkbox" id="java" name="skills" value="Java">
                <label for="java">Java</label>
                <br><br>

                <label for="joining">Available Joining Date:</label>
                <input type="datetime-local" id="joining" name="joining">
                <br><br>

                <label for="month">Available Joining Month:</label>
                <input type="month" id="month" name="month">
                <br><br>

                <label for="week">Preferred Joining Week:</label>
                <input type="week" id="week" name="week">
                <br><br>

                <label for="search">Search a Skill:</label>
                <input type="search" id="search" name="search">
                <br><br>

                <label for="coverletter">Why should we hire you?</label>
                <br>
                <textarea id="coverletter" name="coverletter" rows="5" cols="40"></textarea>
                <br><br>

                <input type="hidden" name="formType" value="jobApplication">

                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms">I confirm that the information is correct.</label>
                <br><br>

                <label for="progress">Application Preparation:</label>
                <progress id="progress" value="70" max="100"></progress>
                <br><br>

                <label for="level">Skill Level:</label>
                <meter id="level" value="7" min="0" max="10">7 out of 10</meter>
                <br><br>

                <input type="submit" value="Submit Application">
                <input type="reset" value="Reset Form">
                <input type="button" value="Click Me" onclick="alert('Thank you for applying!')">

                <br><br>
                <button type="submit">Apply Now</button>
            </fieldset>

        </form>
    </main>

    <footer>
        <p>Thank you for your interest in joining our company!</p>
    </footer>

</body>
</html>
